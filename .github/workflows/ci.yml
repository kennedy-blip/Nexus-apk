name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck · lint · build · assertions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The build must not require real credentials: without Supabase the app
          # still renders and the inspector still works.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Inspector security assertions
        # SSRF guards, scheme rejection, decompression ceiling, extraction and
        # decoding. These must never regress silently.
        run: npm run verify:inspect
