[pytest]
testpaths = tests
# Make `import app...` work whether the suite is run as `pytest` or
# `python -m pytest`. Without this, bare `pytest` only inserts the tests
# directory on sys.path and collection fails with ModuleNotFoundError.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
